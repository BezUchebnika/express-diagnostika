<style>
/* Один тёмный мир, как тренажёр на have: тёмная шапка, вопрос на светлой карточке, финал с голубым этажом */
:root{
  --bg:#111111; --surface:#1A1B1E; --surface-2:#232529; --line:#34373D;
  --fg:#F2F0EC; --muted:#9A978F; --accent:#85B7EB; --accent-ink:#0D1824;

  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.in{max-width:720px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.d{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:.005em}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit}
.hl{color:var(--accent)}
.top{display:flex;justify-content:flex-end;padding-top:28px}
.toplink{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:2px}
.toplink:hover,.toplink:focus-visible{color:var(--accent);border-color:var(--accent);outline:none}

.screen{display:grid;gap:26px;padding-block:28px 64px}
.screen>*{min-width:0}

/* старт */
.hero h1{font-size:clamp(52px,14vw,112px)}
.hero h1 .hl{display:block}
.lead{font-size:19px;max-width:30em;margin-top:18px}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px}
.facts span{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;display:flex;align-items:baseline;gap:6px}
.facts b{color:var(--accent);font-weight:900;font-size:30px}

/* блоки тем в финале */
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{background:var(--surface);border:1.5px solid var(--line);padding:10px 10px 12px;display:grid;gap:4px;align-content:start;min-height:84px;transition:background .35s,border-color .35s,color .35s}
.tile .n{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .t{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;text-transform:uppercase}
.tile .s{font-size:13px;font-weight:600}
.tile{font:inherit;text-align:left;cursor:pointer;color:var(--fg)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile.sel{outline:3px solid var(--fg);outline-offset:2px}
.tinfo{background:var(--surface);padding:14px 16px;display:grid;gap:4px}
.tinfo b{font-weight:600;font-size:18px}

.start{font-size:17px!important;color:var(--muted)}

.tile.g{background:var(--g);border-color:var(--g);color:#10301A}
.tile.y{background:var(--y);border-color:var(--y);color:#3A2C08}
.tile.r{background:var(--r);border-color:var(--r);color:#4A150C}
.tile.g .n,.tile.y .n,.tile.r .n{color:inherit;opacity:.7}
@media (max-width:560px){.map{grid-template-columns:1fr 1fr}.tile{min-height:0}}

.btn{font-weight:600;font-size:17px;padding:15px 22px;cursor:pointer;border:1.5px solid var(--fg);background:transparent;color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase;padding:14px 28px}
.btn.dark{background:#141414;border-color:#141414;color:#F2F0EC}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* прохождение */

.story .now{color:var(--fg)}

.story.full b.ok{color:var(--g)} .story.full b.no{color:var(--r);text-decoration:underline;text-underline-offset:3px}

.opt.wrong{background:#F1D6D0;border-color:#B5594A;color:#5C1D12}

.fbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

.fb p{font-size:17px;line-height:1.5}

/* середина */
.half{min-height:60vh;align-content:center;cursor:pointer}
.half h2{font-size:clamp(56px,15vw,120px)}
.half h2 .hl{display:block}

.zones{display:grid;border-top:1px solid var(--line)}
.zone{display:grid;grid-template-columns:14px 1fr;gap:4px 14px;padding:14px 0;border-bottom:1px solid var(--line)}
.zone .dot{width:14px;height:14px;margin-top:6px}
.zone .dot.y{background:var(--y)} .zone .dot.r{background:var(--r)}
.zone b{font-weight:600;font-size:18px}
.zone b small{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-left:6px}
.zone p{grid-column:2;font-size:15px;color:var(--muted);line-height:1.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;display:inline-block}
.course{display:grid;gap:14px;justify-items:start;font-size:18px;color:var(--accent);max-width:34em}
.course .btn{border-color:var(--accent);color:var(--accent);font-size:16px;padding:12px 18px}
.taphint{font-size:17px;color:var(--fg)}
.course b{color:var(--fg);font-weight:600}

.cta{background:var(--accent);color:var(--accent-ink);padding-block:44px 56px}
.screen.res{padding-bottom:28px}
.sect{font-size:clamp(30px,8vw,40px);color:var(--accent);margin-top:10px}
.tinfo{scroll-margin-bottom:16px}
.cta .in{display:grid;gap:16px}
.cta h2{font-size:clamp(36px,9.5vw,54px)}
.cta p{max-width:32em}
.cta .btn.primary{background:#111111;border-color:#111111;color:#85B7EB;justify-self:start}
.cta .hint{font-size:14px}
.more{padding-block:40px 64px}
.more .in{display:grid;gap:14px}
.more a.vid{display:grid;gap:8px;text-decoration:none;background:var(--surface);color:var(--fg);padding:20px 18px;border:1.5px solid var(--line)}
.more a.vid:hover,.more a.vid:focus-visible{border-color:var(--accent);outline:none}
.more .vt{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(26px,7vw,34px);line-height:1.05}
.more .go{color:var(--accent);font-weight:600;font-size:15px}
.more .row{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.link{color:var(--accent);font-weight:600}
.again{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:15px}

@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .35s ease-out}
  @keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

  @keyframes fade{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Где стоит правильный ответ: поровну по всем трём местам, не больше двух раз подряд на одном месте */
function positions(n){
  for(;;){
    const p=[]; for(let i=0;i<n;i++) p.push(i%3);
    for(let i=p.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[p[i],p[j]]=[p[j],p[i]]}
    if(!p.some((x,i)=>i>1&&x===p[i-1]&&x===p[i-2])) return p;
  }
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const app = document.getElementById('app');
let gi=0, ans=[], picks=[], res=[], busy=false, timer=null;

function stripHTML(){
  return '<div class="strip">'+G.map((_,i)=>`<i class="${ans[i]===true?'g':ans[i]===false?'r':(i===gi?'cur':'')}"></i>`).join('')+'</div>';
}

function start(){
  clearTimeout(timer);
  window.scrollTo(0,0);
  app.innerHTML = `<section class="in screen fade">
    <div class="hero">
      <h1 class="d">Экспресс-<span class="hl">диагностика</span></h1>
      <p class="lead">Вставьте пропущенные слова в короткую историю о поездке. Так проверим основу английского по ${S.length} темам.</p>
    </div>
    <div class="facts"><span><b>4</b> минуты</span><span><b>${S.length}</b> тем</span></div>
    <div><button class="btn primary big" id="go">Начать</button></div>
  </section>`;
  document.getElementById('go').onclick=()=>{ gi=0; ans=[]; picks=[]; res=[]; POS=positions(G.length); track('start'); ask(); };
}

function storyHTML(upto, done){
  const paras=[[],[],[],[]];
  G.forEach((g,i)=>{
    if(i>upto) return;
    let t=esc(g[3]);
    if(i<upto || done) t=t.replace('___','<b class="'+(done?(ans[i]?'ok':'no'):'')+'">'+esc(g[4])+'</b>');
    else t=t.replace('___','<span class="gap" id="gap">&nbsp;</span>');
    paras[g[0]].push(i===upto&&!done?'<span class="now">'+t+'</span>':t);
  });
  return paras.filter(p=>p.length).map(p=>'<p>'+p.join(' ')+'</p>').join('');
}

function fitCard(){
  const c=document.getElementById('card'), gp=document.getElementById('gap'); if(!c) return;
  const r=c.getBoundingClientRect(), H=window.innerHeight;
  if(r.bottom>H-12){
    let dy=r.bottom-H+16;
    if(gp){ const gt=gp.getBoundingClientRect().top-12; if(dy>gt) dy=gt; }
    window.scrollBy(0,dy);
  }
}

function ask(){
  clearTimeout(timer);
  const g=G[gi];
  const wrong=shuffle([g[5],g[6]]); const opts=wrong.slice(); opts.splice(POS[gi],0,g[4]);
  app.innerHTML = `<section class="in screen">
    <div style="display:grid;gap:12px">
      ${stripHTML()}
      <div class="qhead"><span class="mono">Привет из Барселоны!</span><span class="mono">${gi+1} из ${G.length}</span></div>
    </div>
    <div class="story" id="story">${storyHTML(gi,false)}</div>
    <div class="card fade" id="card">
      <p class="ctx">${esc(g[2])}</p>
      <div class="opts">${opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div>
    </div>
  </section>`;
  fitCard();
  busy=false;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(busy) return; busy=true;
    const ok = b.dataset.o===g[4];
    ans[gi]=ok; picks[gi]=b.dataset.o;
    app.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.dataset.o===g[4]) x.classList.add('right'); else if(x===b) x.classList.add('wrong'); });
    const gap=document.getElementById('gap'); if(gap){ gap.textContent=g[4]; gap.classList.add(ok?'ok':'no'); }
    const fb=document.getElementById('fb');
    if(ok){
      fb.className='fb ok'; fb.innerHTML='<span class="fbl">Верно</span>';
      timer=setTimeout(advance, 1000);
    } else {
      fb.className='fb no';
      fb.innerHTML=`<span class="fbl">Не совсем</span><p>${esc(g[7])}</p><button class="btn dark" id="nx">Дальше</button>`;
      const nx=document.getElementById('nx'); nx.focus({preventScroll:true}); nx.onclick=advance; fitCard();
    }
  });
}

function advance(){
  clearTimeout(timer);
  track('g'+(gi+1));
  gi++;
  if(gi>=G.length){ score(); track('finish'); result(); }
  else if(gi===HALF){ half(); }
  else ask();
}

function half(){
  window.scrollTo(0,0);
  app.innerHTML = `<section class="in screen half fade" id="half">
    ${stripHTML()}
    <h2 class="d">Половина <span class="hl">позади</span></h2>
    <p>Осталось ${G.length-HALF} фраз.</p>
  </section>`;
  const go=()=>{ clearTimeout(timer); ask(); };
  document.getElementById('half').onclick=go;
  timer=setTimeout(go, 1600);
}

function score(){
  res=S.map((_,t)=>{ const r=G.map((g,i)=>g[1]===t?ans[i]:null).filter(x=>x!==null); const k=r.filter(Boolean).length; return k===r.length?'g':k===0?'r':'y'; });
}

function pickType(){
  const pts=res.map(c=>c==='g'?0:c==='y'?1:2);
  const sum=(ids)=>ids.reduce((a,i)=>a+pts[i],0);
  const total=pts.reduce((a,b)=>a+b,0);
  const reds=res.filter(c=>c==='r').length;
  if(total<=2) return 'almost';
  if(reds>=5) return 'pieces';
  if(sum([0,1,2])>=3) return 'literal';
  if(sum([4,7,8,9])>=3) return 'tenses';
  return 'speech';
}

function message(){
  const bad=G.map((g,i)=>ans[i]?null:i).filter(i=>i!==null);
  const n=bad.length, m10=n%10, m100=n%100;
  const w=(m10===1&&m100!==11)?'ошибка':(m10>=2&&m10<=4&&(m100<12||m100>14))?'ошибки':'ошибок';
  if(!n) return `Здравствуйте, Артём! Мой результат экспресс-диагностики: без ошибок, ${G.length} из ${G.length}.\n\nПодскажите, пожалуйста, что мне подтянуть дальше?`;
  let m=`Здравствуйте, Артём! Мой результат экспресс-диагностики: ${n} ${w} из ${G.length}.\n`;
  bad.forEach((i,k)=>{ m+=`\n${k+1}. ${G[i][3].replace('___','('+picks[i]+')')}`; });
  m+=`\n\nПодскажите, пожалуйста, с чего мне начать?`;
  return m;
}

function result(){
  const key=pickType(), T=TYPES[key];
  const msg=message();
  window.scrollTo(0,0);
  app.innerHTML = `<section class="in screen res">
    <div class="rtype fade">
      <span class="mono">Ваш результат</span>
      <h1 class="d">${T.h}</h1>
      <p>${esc(T.p)}</p>
      <p class="start"><b>С чего начать:</b> ${esc(T.s)}</p>
    </div>
    <div style="display:grid;gap:12px">
      <h2 class="d sect">Результат по темам</h2>
      <p class="taphint">Нажмите на тему, чтобы узнать, что в ней</p>
      <div class="map">${S.map((s,i)=>`<button class="tile" data-i="${i}"><span class="n">${s.n}</span><span class="t">${esc(s.t)}</span></button>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--g)"></i>работает</span><span><i style="background:var(--y)"></i>шатается</span><span><i style="background:var(--r)"></i>дыра</span></div>
      <div class="tinfo" id="tinfo" aria-live="polite"></div>
    </div>
    <div class="course">
      <p>Каждый блок это урок курса BezUchebnika. На курсе темы выстраиваются в единую систему и вместе дают всю необходимую базу, чтобы уверенно говорить по-английски и понимать других.</p>
      <a class="btn" id="course" href="${ARTEM}?text=${encodeURIComponent('курс')}" target="_blank" rel="noopener">Спросить у Артёма про курс ↗</a>
    </div>
  </section>
  <section class="cta">
    <div class="in">
      <h2 class="d">Хотите личный разбор?</h2>
      <p>Отправьте мне свой результат. Я посмотрю, какие темы у вас проседают, и подскажу, с чего начать.</p>
      <a class="btn primary" id="ask" href="${ARTEM}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Получить разбор от Артёма ↗</a>
      <p class="hint" id="hint" hidden>Если сообщение не появилось в чате, просто вставьте его: оно уже скопировано.</p>
    </div>
  </section>
  <section class="more">
    <div class="in">
      <span class="mono">Хотите узнать больше про основы английского?</span>
      <a class="vid" id="vid" href="${VIDEO}" target="_blank" rel="noopener">
        <span class="vt">СХЕМА, которая исправит ваш английский</span>
        <span style="font-size:15px;color:var(--muted)">Видео о том, по какой схеме строится английское предложение и откуда берутся ошибки дословного перевода.</span>
        <span class="go">Смотреть на YouTube ↗</span>
      </a>
      <div class="row">
        <a class="link" id="tg" href="${CHANNEL}" target="_blank" rel="noopener">Телеграм-канал BezUchebnika ↗</a>
        <button class="again" id="again">Пройти ещё раз</button>
      </div>
    </div>
  </section>`;
  const tiles=[...app.querySelectorAll('.map .tile')];
  tiles.forEach((el,i)=>setTimeout(()=>{
    el.classList.add(res[i],'pop');
    const s=document.createElement('span'); s.className='s'; s.textContent=WORD[res[i]]; el.appendChild(s);
  }, 250+i*120));
  const info=document.getElementById('tinfo');
  const show=i=>{ tiles.forEach(t=>t.classList.toggle('sel',+t.dataset.i===i)); const x=S[i];
    info.innerHTML=`<b>${esc(x.name)}</b> <span class="mono">${x.n} · ${WORD[res[i]]}</span><p>${esc(x.z)}</p>`; };
  tiles.forEach(t=>t.onclick=()=>{ show(+t.dataset.i); info.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'}); });
  let first=res.indexOf('r'); if(first<0) first=res.indexOf('y'); if(first<0) first=0; show(first);
  document.getElementById('ask').onclick=()=>{
    track('ask');
    try{ navigator.clipboard.writeText(msg).catch(()=>{}); }catch(e){}
    document.getElementById('hint').hidden=false;
  };
  document.getElementById('vid').onclick=()=>track('video');
  document.getElementById('course').onclick=()=>track('course');
  document.getElementById('tg').onclick=()=>track('channel');
  document.getElementById('again').onclick=()=>{ track('again'); start(); };
}

start();
</script>
<script data-goatcounter="https://bezuchebnika.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

</body>
</html>
